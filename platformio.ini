; PlatformIO Project Configuration File
;
; Matrix Clock with animation. Two supported hardware targets:
;   adafruit_matrixportal_s3   Adafruit MatrixPortal S3 (ESP32-S3, WiFi on-chip)
;   adafruit_matrix_portal_m4  Adafruit MatrixPortal M4 (SAMD51 + WiFiNINA)
;
; Build:    pio run                      (default target, see default_envs)
;           pio run -e adafruit_matrix_portal_m4
; Upload:   see the notes in each board section below
; Monitor:  pio device monitor
; Run command-line builds from PowerShell or cmd, not from Git Bash: the S3
; platform installs its tools through ESP-IDF's idf_tools.py, which refuses to
; run when MSYSTEM is set (MSYS/MinGW shells). The VS Code buttons are not
; affected, they start PlatformIO without a shell.
;
; Platforms and libraries are pinned to exact versions: these are the ones the
; firmware was tested on hardware with. Unpinned specs resolve to whatever is
; newest (or already installed) on the building machine, so the same checkout
; could produce a different firmware elsewhere. Update them deliberately and
; retest.
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adafruit_matrixportal_s3
; Own PlatformIO core dir for this project. The S3's pioarduino platform treats
; its packages dir as its own: on every build or IDE project refresh it deletes
; all other Arduino-ESP32 framework versions there (platform.py,
; _configure_arduino_framework) and sets up its own Python env inside it. In the
; shared ~/.platformio that breaks every other ESP32 project on the machine, so
; this project keeps platforms, packages and that env separate.
core_dir = ~/.platformio-pioarduino

; --- Settings and libraries shared by both boards -----------------------------
[env]
framework = arduino

; Serial console (matches boardSerialBegin(115200) in the code)
monitor_speed = 115200

; Every library both boards build in, including BusIO, which GFX and LIS3DH
; pull in. The panel driver differs per board, see the board sections.
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6    ; graphics/font base (fonts, color565)
    adafruit/Adafruit BusIO @ 1.17.4          ; I2C/SPI helper used by GFX and LIS3DH
    adafruit/Adafruit LIS3DH @ 1.3.0          ; onboard accelerometer (orientation detection)
    adafruit/Adafruit Unified Sensor @ 1.1.15 ; sensor base class for LIS3DH
    robtillaart/BH1750FVI_RT @ 0.3.4          ; external I2C ambient light sensor (auto-brightness)
    adafruit/RTClib @ 2.1.4                   ; DS3231 real-time clock on I2C (optional, keeps the time without power)
    acrandal/RevEng PAJ7620 @ 1.5.0           ; PAJ7620U2 gesture sensor on I2C (optional)
; The clock keeps time in src/clock_time.h (C library only) instead of the
; unmaintained Time library, which does not build against picolibc.

; --- Adafruit MatrixPortal S3 (ESP32-S3) --------------------------------------
; WiFi, SNTP and the settings storage (NVS) all live on the main MCU, so no extra
; libraries are needed beyond the Arduino core.
;
; Put the board into a bootloader before uploading - the running clock ignores
; the automatic reset over its USB port (1200 bps or DTR/RTS; it left Windows
; with a dead serial port anyway, see the README):
;  - UF2: double-tap RESET and copy .pio/build/adafruit_matrixportal_s3/
;    firmware.uf2 (written by every build) onto the MATRXS3BOOT drive, or
;  - ROM: hold BOOT, tap RESET, release BOOT, "pio run -t upload --upload-port
;    <port>", then press RESET to start the clock.
; NOTE: the settings live in the NVS partition at 0x9000, which a normal upload
; does not touch. "pio run -t erase" DOES wipe it and resets the clock to defaults.
; Platform: pioarduino 55.03.311 = Espressif's unmodified Arduino-ESP32 3.3.11
; release on ESP-IDF 5.5.5. PlatformIO's own espressif32 platform only ships
; Arduino-ESP32 2.0.17 on ESP-IDF 4.4, which has been end-of-life (no bug or
; security fixes) since July 2024; pioarduino is the maintained route to the
; current core. It needs the separate core_dir set in [platformio] above. The
; tinyuf2 partition table is the same as with the 2.x core, so the settings in
; NVS stay where they are.
;
; Panel driver: ESP32-HUB75-MatrixPanel-DMA, which keeps its own frame buffer at
; 8 bits per colour and dims through the OE time, so dimming costs no colour
; levels (Protomatter draws into RGB565 and dims by scaling the colours).
; NO_CIE1931 switches its brightness curve off: the clock's colours and
; brightness levels stay linear, as they were tuned with Protomatter.
;
; GIF playback: scripts/embed_gifs.py builds the GIFs of gifs/ that fit the
; panel into the firmware, plus those of the folders listed in gif_dirs.local
; (not in git, for private GIFs) up to custom_gif_budget_kb, smallest first.
[env:adafruit_matrixportal_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = adafruit_matrixportal_esp32s3
extra_scripts =
    pre:scripts/embed_gifs.py
    post:scripts/make_uf2.py
custom_gif_panel = 64x32
custom_gif_budget_kb = 600
build_flags =
    -D NO_CIE1931
lib_deps =
    ${env.lib_deps}
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ 3.0.15   ; RGB matrix driver (LCD_CAM + GDMA)
    bitbank2/AnimatedGIF @ 2.2.3              ; GIF decoder for the GIF playback
; Point the first SNTP server at a server on the LAN if the clock has no internet
; access, by adding to build_flags:  -D NTP_SERVER_1='"192.168.2.1"'

; Diagnostic variant of the S3 build: the console runs over the chip's built-in
; USB-Serial-JTAG (the same COM port as the ROM bootloader, so it survives from
; reset into the app), the boot waits up to 20 s for a serial monitor, and the
; core's own log output is enabled.
[env:adafruit_matrixportal_s3_debug]
extends = env:adafruit_matrixportal_s3
build_flags =
    ${env:adafruit_matrixportal_s3.build_flags}
    -D ARDUINO_USB_MODE=1
    -D BOOT_WAIT_FOR_SERIAL_MS=20000
    -D CORE_DEBUG_LEVEL=4
    -D CLOCK_DEBUG=1

; --- Adafruit MatrixPortal M4 (SAMD51 + WiFiNINA) -----------------------------
; Upload goes through the SAM-BA / UF2 bootloader.
; Note: before uploading, press the RESET button twice quickly so the board
; shows up as a bootloader drive. PlatformIO then finds the port by itself.
; Pin the port explicitly if needed:
; upload_port = COMx
;
; WiFiNINA 2.0.x pairs with the new nina-fw firmware line (2.0.0+/3.x, via the
; Arduino_SpiNINA driver). The board runs nina-fw 3.3.0, so 2.0.x is the
; matching library. (1.9.1 was a stopgap while the board still had old 1.7.4 fw.)
[env:adafruit_matrix_portal_m4]
platform = atmelsam @ 8.3.0
board = adafruit_matrix_portal_m4
; The top of the flash holds the stored settings, one 8 KB block each from
; 0x7A000 up (board_hal.h). The sketch starts at 0x4000 after the bootloader and
; must end below them, so a program that grew into them fails the size check
; instead of being overwritten by the next save: 0x7A000 - 0x4000.
board_upload.maximum_size = 483328
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit Protomatter @ 1.7.1     ; RGB matrix driver (SAMD51 DMA); its example deps are not compiled in
    arduino-libraries/WiFiNINA @ 2.0.1        ; WiFi (station + AP) and NTP; pairs with nina-fw 3.x
    arduino-libraries/Arduino_SpiNINA @ 0.0.2 ; SPI transport WiFiNINA 2.x talks to the NINA through
    khoih-prog/FlashStorage_SAMD @ 1.3.2      ; persistent settings in flash
; The S3's panel driver and GIF decoder sit behind #if in the sketch, which the
; library finder does not evaluate; AnimatedGIF does not even build for the M4.
lib_ignore =
    AnimatedGIF
    ESP32 HUB75 LED MATRIX PANEL DMA Display
