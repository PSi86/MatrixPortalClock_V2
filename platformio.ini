; PlatformIO Project Configuration File
;
; Matrix Clock with animation. Two supported hardware targets:
;   adafruit_matrixportal_s3   Adafruit MatrixPortal S3 (ESP32-S3, WiFi on-chip)
;   adafruit_matrix_portal_m4  Adafruit MatrixPortal M4 (SAMD51 + WiFiNINA)
;
; Build:    pio run                      (default target, see default_envs)
;           pio run -e adafruit_matrix_portal_m4
; Upload:   see the notes in each board section below
; Monitor:  pio device monitor
; Run command-line builds from PowerShell or cmd, not from Git Bash: the S3
; platform installs its tools through ESP-IDF's idf_tools.py, which refuses to
; run when MSYSTEM is set (MSYS/MinGW shells). The VS Code buttons are not
; affected, they start PlatformIO without a shell.
;
; Platforms and libraries are pinned to exact versions: these are the ones the
; firmware was tested on hardware with. Unpinned specs resolve to whatever is
; newest (or already installed) on the building machine, so the same checkout
; could produce a different firmware elsewhere. Update them deliberately and
; retest.
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adafruit_matrixportal_s3
; Own PlatformIO core dir for this project. The S3's pioarduino platform treats
; its packages dir as its own: on every build or IDE project refresh it deletes
; all other Arduino-ESP32 framework versions there (platform.py,
; _configure_arduino_framework) and sets up its own Python env inside it. In the
; shared ~/.platformio that breaks every other ESP32 project on the machine, so
; this project keeps platforms, packages and that env separate.
core_dir = ~/.platformio-pioarduino

; --- Settings and libraries shared by both boards -----------------------------
[env]
framework = arduino

; Serial console (matches boardSerialBegin(115200) in the code)
monitor_speed = 115200

; Every library both boards build in, including BusIO, which GFX and LIS3DH
; pull in. The panel driver differs per board, see the board sections.
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6    ; graphics/font base (fonts, color565)
    adafruit/Adafruit BusIO @ 1.17.4          ; I2C/SPI helper used by GFX and LIS3DH
    adafruit/Adafruit LIS3DH @ 1.3.0          ; onboard accelerometer (orientation detection)
    adafruit/Adafruit Unified Sensor @ 1.1.15 ; sensor base class for LIS3DH
    robtillaart/BH1750FVI_RT @ 0.3.4          ; external I2C ambient light sensor (auto-brightness)
    adafruit/RTClib @ 2.1.4                   ; DS3231 real-time clock on I2C (optional, keeps the time without power)
    acrandal/RevEng PAJ7620 @ 1.5.0           ; PAJ7620U2 gesture sensor on I2C (optional)
; The clock keeps time in src/clock_time.h (C library only) instead of the
; unmaintained Time library, which does not build against picolibc.

; --- Adafruit MatrixPortal S3 (ESP32-S3) --------------------------------------
; WiFi, SNTP and the settings storage (NVS) all live on the main MCU, so no extra
; libraries are needed beyond the Arduino core.
;
; Flash layout (decided 2026-10-09): partitions_clock_s3.csv with the board
; boards/adafruit_matrixportal_esp32s3_clock.json, in place of Adafruit's TinyUF2
; layout: two app slots of 1792 KB (for updates over WiFi), no GIFs in the
; firmware, 4544 KB for the GIF pack; nvs and otadata stay where they were, so
; the settings survive. There is no TinyUF2 and no MATRXS3BOOT drive any more.
; The console is the chip's own USB-Serial-JTAG (ARDUINO_USB_MODE=1, USB
; 303A:1001), so esptool resets the board into its ROM bootloader by itself:
;    pio run -e adafruit_matrixportal_s3 -t upload --upload-port <port>
; and a watchdog reset starts the clock again. Should that ever fail, the ROM
; bootloader is always there: hold BOOT, tap RESET, release BOOT. Going back to
; Adafruit's layout, TinyUF2 and CircuitPython: see "Flash layout" in the README.
; NOTE: the settings live in the NVS partition at 0x9000, which an upload does
; not touch. "pio run -t erase" DOES wipe it and resets the clock to defaults.
; Platform: pioarduino 55.03.311 = Espressif's unmodified Arduino-ESP32 3.3.11
; release on ESP-IDF 5.5.5. PlatformIO's own espressif32 platform only ships
; Arduino-ESP32 2.0.17 on ESP-IDF 4.4, which has been end-of-life (no bug or
; security fixes) since July 2024; pioarduino is the maintained route to the
; current core. It needs the separate core_dir set in [platformio] above.
; scripts/check_app_size.py stops the build when firmware.bin does not fit its
; app slot (PlatformIO's "Flash:" line reads about 26 KB low).
;
; Panel driver: ESP32-HUB75-MatrixPanel-DMA, which keeps its own frame buffer at
; 8 bits per colour and dims through the OE time, so dimming costs no colour
; levels (Protomatter draws into RGB565 and dims by scaling the colours).
; NO_CIE1931 switches its brightness curve off: the clock's colours and
; brightness levels stay linear, as they were tuned with Protomatter.
;
; GIF playback: all GIFs are in the GIF pack in the ffat partition.
; scripts/gif_pack.py adds the targets gifpack, sendgifs (over the home network)
; and uploadgifs (ROM bootloader); the pack takes the folders listed in
; gif_pack.local (not in git) or in GIF_PACK_DIRS - the repository brings no
; GIFs; see "GIF pack" in the README. custom_gif_orientation is how
; the clock stands: landscape (GIFs up to 64x32), portrait (up to 32x64) or both.
[env:adafruit_matrixportal_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = adafruit_matrixportal_esp32s3_clock
board_build.partitions = partitions_clock_s3.csv
extra_scripts =
    pre:scripts/embed_webui.py
    post:scripts/check_app_size.py
    post:scripts/gif_pack.py
custom_gif_panel = 64x32
custom_gif_orientation = landscape
; The console on the USB-Serial-JTAG: opened with DTR and RTS low, as raised
; lines reset the chip.
monitor_dtr = 0
monitor_rts = 0
; What every S3 build is built with. The release adds CORE_DEBUG_LEVEL=0: it has
; no console (src/console.h), and without the define the core would still print
; its own errors (its default level is "error"). The debug builds take these
; flags with CORE_DEBUG_LEVEL=1 instead.
custom_flags =
    -D NO_CIE1931
build_flags =
    ${env:adafruit_matrixportal_s3.custom_flags}
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    ${env.lib_deps}
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ 3.0.15   ; RGB matrix driver (LCD_CAM + GDMA)
    bitbank2/AnimatedGIF @ 2.2.3              ; GIF decoder for the GIF playback
    bblanchon/ArduinoJson @ 7.4.3             ; the info band's sources answer in JSON (src/band_data.h)
; The wall clock's copy of the panel driver (lib/hub75-dma-wall) is not for this board.
lib_ignore =
    ESP32 HUB75 LED MATRIX PANEL DMA Display - wall clock copy
; Point the first SNTP server at a server on the LAN if the clock has no internet
; access, by adding to build_flags:  -D NTP_SERVER_1='"192.168.2.1"'

; Diagnostic variant of the S3 build: the only S3 build with a console (the
; release builds have none, src/console.h). The boot waits up to 20 s for a
; serial monitor; the clock logs at level 1 (start, sensors, errors, changes of
; state), "log 2" on the console adds the running figures, and of the core's
; own lines only its errors come (CORE_DEBUG_LEVEL=1). Level 3, the core's WiFi
; and HTTP lines as well, is env:adafruit_matrixportal_s3_verbose below.
[env:adafruit_matrixportal_s3_debug]
extends = env:adafruit_matrixportal_s3
build_flags =
    ${env:adafruit_matrixportal_s3.custom_flags}
    -D BOOT_WAIT_FOR_SERIAL_MS=20000
    -D CORE_DEBUG_LEVEL=1
    -D CLOCK_DEBUG=1

; Level 3 of the console (src/console.h): the debug build with the core's WiFi
; and HTTP lines as well (CORE_DEBUG_LEVEL=4), the running figures from the start.
[env:adafruit_matrixportal_s3_verbose]
extends = env:adafruit_matrixportal_s3_debug
build_flags =
    ${env:adafruit_matrixportal_s3.custom_flags}
    -D BOOT_WAIT_FOR_SERIAL_MS=20000
    -D CORE_DEBUG_LEVEL=4
    -D CLOCK_DEBUG=1
    -D CLOCK_LOG=2

; --- Wall clock: Waveshare ESP32-S3-RGB-Matrix with six 64x64 panels -----------
; The S3 clock's firmware on the wall clock board (ESP32-S3, 32 MB octal flash,
; 16 MB octal PSRAM) driving 3x2 panels of 64x64 as one 192x128 wall
; (src/board_hal.h, BOARD_WAVESHARE_WALL). The clock draws its 64x32 picture as
; on the MatrixPortal and the panel driver puts it on the wall three times its
; size; GIFs play at up to 192x128. Its own board definition and pin variant
; (variants/waveshare_esp32s3_rgb_matrix: I2C on the GPIO header IO45/IO46, no
; LED) and flash layout (partitions_wallclock.csv: 3 MB app slots, about 26 MB
; for the GIF pack). Uploads like the MatrixPortal S3's over the board's
; USB-Serial-JTAG, which has the same USB id: pick the port by the board's USB
; serial number, and set the panels black before flashing (POST /api/black).
;    pio run -e waveshare_wallclock -t upload --upload-port <port>
; The panel driver's frame buffer is in PSRAM (SPIRAM_DMA_BUFFER): at 8 bits it
; takes 192 KB, and in internal RAM the WiFi no longer had room (2026-10-18).
; The driver is a copy of 3.0.15 in lib/hub75-dma-wall with a cache write-back
; per row added (its README); the MatrixPortal S3 keeps the registry release.
; Its bus runs at 160 MHz / PSRAM_LCD_DIV_NUM = 16 MHz (160 Hz) instead of the
; driver's 13.3 MHz; 20 MHz stopped the output (2026-10-18).
[env:waveshare_wallclock]
extends = env:adafruit_matrixportal_s3
board = waveshare_esp32s3_rgb_matrix_clock
board_build.partitions = partitions_wallclock.csv
board_build.variants_dir = variants
custom_gif_panel = 192x128
custom_gif_orientation = landscape
custom_flags =
    ${env:adafruit_matrixportal_s3.custom_flags}
    -D SPIRAM_DMA_BUFFER
    -D PSRAM_LCD_DIV_NUM=10
build_flags =
    ${env:waveshare_wallclock.custom_flags}
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    ${env.lib_deps}
    bitbank2/AnimatedGIF @ 2.2.3              ; GIF decoder for the GIF playback
    bblanchon/ArduinoJson @ 7.4.3             ; the info band's sources answer in JSON (src/band_data.h)
lib_ignore =
    ESP32 HUB75 LED MATRIX PANEL DMA Display

; The wall clock's diagnostic build, as the S3's above (console, log levels).
[env:waveshare_wallclock_debug]
extends = env:waveshare_wallclock
build_flags =
    ${env:waveshare_wallclock.custom_flags}
    -D BOOT_WAIT_FOR_SERIAL_MS=20000
    -D CORE_DEBUG_LEVEL=1
    -D CLOCK_DEBUG=1

; The wall clock at level 3, as env:adafruit_matrixportal_s3_verbose.
[env:waveshare_wallclock_verbose]
extends = env:waveshare_wallclock_debug
build_flags =
    ${env:waveshare_wallclock.custom_flags}
    -D BOOT_WAIT_FOR_SERIAL_MS=20000
    -D CORE_DEBUG_LEVEL=4
    -D CLOCK_DEBUG=1
    -D CLOCK_LOG=2

; --- Adafruit MatrixPortal M4 (SAMD51 + WiFiNINA) -----------------------------
; Upload goes through the SAM-BA / UF2 bootloader.
; Note: before uploading, press the RESET button twice quickly so the board
; shows up as a bootloader drive. PlatformIO then finds the port by itself.
; Pin the port explicitly if needed:
; upload_port = COMx
;
; WiFiNINA 2.0.x pairs with the new nina-fw firmware line (2.0.0+/3.x, via the
; Arduino_SpiNINA driver). The board runs nina-fw 3.3.0, so 2.0.x is the
; matching library. (1.9.1 was a stopgap while the board still had old 1.7.4 fw.)
[env:adafruit_matrix_portal_m4]
platform = atmelsam @ 8.3.0
board = adafruit_matrix_portal_m4
; The top of the flash holds the stored settings, one 8 KB block each from
; 0x76000 up (board_hal.h). The sketch starts at 0x4000 after the bootloader and
; must end below them, so a program that grew into them fails the size check
; instead of being overwritten by the next save: 0x76000 - 0x4000.
board_upload.maximum_size = 466944
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit Protomatter @ 1.7.1     ; RGB matrix driver (SAMD51 DMA); its example deps are not compiled in
    arduino-libraries/WiFiNINA @ 2.0.1        ; WiFi (station + AP) and NTP; pairs with nina-fw 3.x
    arduino-libraries/Arduino_SpiNINA @ 0.0.2 ; SPI transport WiFiNINA 2.x talks to the NINA through
    khoih-prog/FlashStorage_SAMD @ 1.3.2      ; persistent settings in flash
; The S3's panel driver and GIF decoder sit behind #if in the sketch, which the
; library finder does not evaluate; AnimatedGIF does not even build for the M4.
lib_ignore =
    AnimatedGIF
    ESP32 HUB75 LED MATRIX PANEL DMA Display
    ESP32 HUB75 LED MATRIX PANEL DMA Display - wall clock copy
